<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <notify_time>10</notify_time>
    <time-reconnect>30</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>wazuh.manager</manager_address>
      <port>1515</port>
      <agent_name>scl-telemetry-v2</agent_name>
    </enrollment>
  </client>
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>200</events_per_second>
  </client_buffer>
  <localfile><log_format>json</log_format><location>/scl-logs/waf-normalized.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/scl-logs/ips-normalized.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/scl-logs/response-dlp.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/scl-logs/egress-dlp.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/scl-logs/internal-assets.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/scl-logs/receiver.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/scl-logs/runtime.jsonl</location></localfile>
  <localfile><log_format>json</log_format><location>/scl-logs/authorization.jsonl</location></localfile>
  <logging><log_format>plain</log_format></logging>
</ossec_config>
